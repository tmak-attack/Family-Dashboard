<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1 class="dashboard-title">Family Dashboard</h1>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">Active Tasks</span>
                        <span class="stat-value" id="activeTasks">4</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Week Progress</span>
                        <span class="stat-value" id="weekProgress">72%</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <main class="dashboard-grid">
            <!-- Health & Critical Tasks Widget -->
            <section class="widget health-critical-tasks">
                <h2 class="widget-title">🏥 Health & Critical Tasks</h2>
                <div class="health-critical-content" id="healthCriticalContent">
                    <!-- Health and critical tasks will be generated here -->
                </div>
            </section>

            <!-- Family Overview Widget -->
            <section class="widget family-overview">
                <h2 class="widget-title">👨‍👩‍👧‍👦 Family Overview</h2>
                <div class="family-overview-content" id="familyOverviewContent">
                    <!-- Family overview will be generated here -->
                </div>
            </section>

            <!-- Family Members Section -->
            <section class="widget family-members">
                <h2 class="widget-title">Family Members</h2>
                <div class="family-grid" id="familyGrid">
                    <!-- Family member cards will be generated here -->
                </div>
            </section>

            <!-- Today's Chores -->
            <section class="widget chores-today">
                <h2 class="widget-title">Today's Chores</h2>
                <div class="chores-list" id="choresList">
                    <!-- Chore cards will be generated here -->
                </div>
            </section>

            <!-- Allowance Tracker -->
            <section class="widget allowance-tracker">
                <h2 class="widget-title">Allowance Tracker</h2>
                <div class="allowance-content" id="allowanceContent">
                    <!-- Allowance info will be generated here -->
                </div>
            </section>

            <!-- Shopping Lists -->
            <section class="widget shopping-lists">
                <h2 class="widget-title">Shopping Lists</h2>
                <div class="shopping-content" id="shoppingContent">
                    <!-- Shopping lists will be generated here -->
                </div>
            </section>

            <!-- Weather Widget -->
            <section class="widget weather-widget">
                <h2 class="widget-title">Weather</h2>
                <div class="weather-content" id="weatherContent">
                    <!-- Weather info will be generated here -->
                </div>
            </section>

            <!-- Calendar Widget -->
            <section class="widget calendar-widget">
                <h2 class="widget-title">Upcoming Events</h2>
                <div class="calendar-content" id="calendarContent">
                    <!-- Calendar events will be generated here -->
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
