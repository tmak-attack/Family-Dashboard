<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard - Household Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h2 class="app-title">Family Hub</h2>
        <div class="app-subtitle">Management System</div>
      </div>
      <ul class="nav-menu">
        <li class="nav-item active"><button class="nav-btn" data-section="dashboard"><span class="nav-icon">📊</span> Dashboard</button></li>
        <li class="nav-item"><button class="nav-btn" data-section="chores"><span class="nav-icon">✓</span> Chores</button></li>
        <li class="nav-item"><button class="nav-btn" data-section="family"><span class="nav-icon">👥</span> Family</button></li>
        <li class="nav-item"><button class="nav-btn" data-section="rewards"><span class="nav-icon">🎯</span> Rewards</button></li>
        <li class="nav-item"><button class="nav-btn" data-section="calendar"><span class="nav-icon">📅</span> Calendar</button></li>
        <li class="nav-item"><button class="nav-btn" data-section="settings"><span class="nav-icon">⚙️</span> Settings</button></li>
      </ul>
    </nav>
    <!-- Main Content -->
    <main class="main-content" style="flex:1;padding:32px;">
      <h2 style="margin-top:0;color:#3B82F6;">Family Dashboard</h2>
      <section>
        <h3>👥 Family Members</h3>
        <div id="family-list"></div>
      </section>
      <section>
        <h3>✓ Today's Chores</h3>
        <div id="chores-list"></div>
      </section>
      <section>
        <h3>💲 Allowance Stats</h3>
        <div id="allowance-stats"></div>
      </section>
      <section>
        <h3>📊 Chore Stats</h3>
        <div id="chore-stats"></div>
      </section>
      <section>
        <h3>🛒 Shopping Lists</h3>
        <div id="shopping-lists"></div>
      </section>
      <section>
        <h3>☀️ Weather</h3>
        <div id="weather-widget"></div>
      </section>
      <section>
        <h3>📅 Calendar</h3>
        <div id="calendar-widget"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
